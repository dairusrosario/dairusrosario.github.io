<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta</title>
<meta name="theme-color" content="#f7f2ea">
<meta name="description" content="Carta digital">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dairus Rosario">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&family=Oswald:wght@200;300;400;500&display=swap" rel="stylesheet">
<script>
  /* Recuerda el tema de la visita anterior y lo aplica antes del primer pintado. */
  try { if (localStorage.getItem("carta_tema") === "oscuro")
          document.documentElement.dataset.theme = "oscuro"; } catch (e) {}
</script>
<style>
  /* ---------- tema claro: el de la carta impresa, y el que se pinta primero ----------
     Es el valor por defecto a propósito: así el primer cuadro que dibuja el
     navegador ya sale en crema y no hay pantallazo mientras carga la base. */
  :root{
    --accent:#e2b263;
    --accent-text:#2f6152;                                     /* si el navegador no soporta color-mix */
    --accent-text:color-mix(in srgb, var(--accent) 74%, #0f2a24);
    --accent-ink:#ffffff;      /* texto sobre el color de acento */
    --dim:.60;
    --font:'Playfair Display', Georgia, serif;
    --body-font:'Inter', system-ui, sans-serif;
    --bg:#f7f2ea;
    --veil:247,242,234;        /* velo sobre la foto de fondo */
    --ink:#2b332e;
    --ink-soft:rgba(43,51,46,.74);
    --line:rgba(43,51,46,.16);
    --line-soft:rgba(43,51,46,.08);
    --dots:rgba(43,51,46,.26);
    --nav-a:rgba(247,242,234,.95);
    --nav-b:rgba(247,242,234,.74);
    --aviso:rgba(43,51,46,.94);
  }
  /* ---------- tema oscuro ---------- */
  :root[data-theme="oscuro"]{
    --accent-text:var(--accent);
    --accent-ink:#161208;
    --bg:#0d0b0a;
    --veil:9,8,7;
    --ink:#f6f1e9;
    --ink-soft:rgba(246,241,233,.62);
    --line:rgba(246,241,233,.18);
    --line-soft:rgba(246,241,233,.07);
    --dots:rgba(246,241,233,.28);
    --nav-a:rgba(9,8,7,.94);
    --nav-b:rgba(9,8,7,.72);
    --aviso:rgba(20,17,14,.94);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body-font); font-weight:300;
    line-height:1.5; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #bg{position:fixed; inset:0; z-index:0; background:var(--bg) center/cover no-repeat; }
  #bg::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg,
      rgba(var(--veil),calc(var(--dim) * .82)) 0%,
      rgba(var(--veil),var(--dim)) 38%,
      rgba(var(--veil),calc(var(--dim) + (1 - var(--dim)) * .55)) 100%);}
  .wrap{position:relative; z-index:1; max-width:640px; margin:0 auto; padding:0 20px 72px}

  /* ---------- encabezado ---------- */
  header{padding:56px 0 26px; text-align:center}
  /* Recorte circular: sirve tanto para un logo ya redondo como para uno cuadrado. */
  #logo{
    width:120px; height:120px; border-radius:50%; object-fit:cover;
    margin:0 auto 20px; display:none;
  }
  h1{
    font-family:var(--font); font-weight:600; margin:0;
    font-size:clamp(2rem, 9vw, 2.9rem); line-height:1.08; letter-spacing:.005em;
  }
  #tagline{margin:12px auto 0; max-width:34ch; color:var(--ink-soft); font-size:.92rem; letter-spacing:.06em; text-transform:uppercase}
  .rule{width:54px; height:1px; background:var(--accent); margin:24px auto 0; opacity:.85}

  /* ---------- navegación ---------- */
  nav{
    position:sticky; top:0; z-index:5; margin:26px -20px 0; padding:11px 0;
    background:linear-gradient(180deg, var(--nav-a), var(--nav-b));
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid transparent; transition:border-color .25s;
  }
  nav.stuck{border-bottom-color:var(--line)}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:0 20px; scrollbar-width:none; -ms-overflow-style:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    padding:7px 15px; border-radius:999px; font:inherit; font-size:.8rem; letter-spacing:.09em;
    text-transform:uppercase; cursor:pointer; white-space:nowrap; transition:.2s;
  }
  .chip[aria-current="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}

  /* ---------- buscador ---------- */
  .buscar{
    display:flex; align-items:center; gap:9px; margin:0 20px 9px;
    border:1px solid var(--line); border-radius:999px; padding:0 14px;
    transition:border-color .2s;
  }
  .buscar:focus-within{border-color:var(--accent)}
  .buscar svg{width:16px; height:16px; flex:0 0 auto; fill:none; stroke:var(--ink-soft);
              stroke-width:1.8; stroke-linecap:round}
  .buscar input{
    flex:1 1 auto; min-width:0; border:0; background:transparent; color:var(--ink);
    font:inherit; font-size:.92rem; padding:10px 0; outline:none;
  }
  .buscar input::placeholder{color:var(--ink-soft)}
  .buscar input::-webkit-search-cancel-button{display:none}
  .buscar button{
    flex:0 0 auto; border:0; background:transparent; color:var(--ink-soft);
    font:inherit; font-size:1.3rem; line-height:1; cursor:pointer; padding:4px 2px;
  }
  .q-info{margin:0 20px; color:var(--ink-soft); font-size:.76rem;
          letter-spacing:.08em; text-transform:uppercase}
  [hidden]{display:none !important}

  /* ---------- secciones ---------- */
  /* El alto de la barra pegajosa lo mide el script: así el salto a una sección
     cae en el lugar justo aunque la barra cambie de alto. */
  section{padding-top:44px; scroll-margin-top:calc(var(--nav-h, 74px) + 8px); position:relative}
  /* Foto de la sección: se muestra entera, a todo el ancho, arriba del título. */
  section.con-foto{padding-top:0}
  /* La proporción es fija (2.4:1), la misma con la que recorta el panel:
     así lo que se encuadra ahí es exactamente lo que se ve acá, en cualquier pantalla.
     Con alto fijo, la caja cambiaba de forma según el ancho y `cover` comía el resto. */
  .sec-foto{
    display:block; width:calc(100% + 40px); margin:36px -20px 0;
    aspect-ratio:2.4 / 1; object-fit:cover; background:var(--line-soft);
  }
  section.con-foto .sec-head{padding-top:20px}
  h2{
    font-family:var(--font); font-weight:500; font-size:1.42rem; margin:0;
    letter-spacing:.02em; color:var(--accent-text);
  }
  .sec-desc{margin:6px 0 0; color:var(--ink-soft); font-size:.88rem}
  /* Barrita corta bajo el título, como en la carta impresa. */
  .sec-head{padding-bottom:14px; margin-bottom:6px; border-bottom:1px solid var(--line-soft)}
  h2::after{content:''; display:block; width:46px; height:2px; background:var(--accent); margin-top:9px}

  .item{padding:16px 0; border-bottom:1px solid var(--line-soft)}
  .item:last-child, .item.ultimo{border-bottom:none}
  /* Con foto el producto se parte en dos columnas. Sin foto queda igual que
     siempre, así una sección donde sólo algunos tienen foto no se desarma:
     el nombre y el precio siguen en la misma línea. */
  .item.con-foto{display:flex; gap:13px; align-items:flex-start}
  .item-foto{width:74px; height:74px; flex:0 0 auto; object-fit:cover; border-radius:10px;
             background:var(--line-soft); cursor:zoom-in; border:1px solid var(--line-soft)}
  .item.con-foto .item-cuerpo{flex:1 1 auto; min-width:0}
  .item-head{display:flex; align-items:baseline; gap:10px}
  .item-name{font-weight:500; font-size:1.02rem; color:var(--ink)}
  .dots{flex:1 1 auto; height:0; border-bottom:1px dotted var(--dots); transform:translateY(-4px); min-width:14px}
  .item-price{font-weight:500; font-size:1rem; font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink)}
  /* Producto sin precio cargado: "Consultar" en tono menor, para que no se
     confunda con un importe ni quede un hueco raro. */
  .item-price.consultar{font-weight:400; font-size:.86rem; color:var(--ink-soft);
                        font-variant-numeric:normal; letter-spacing:.03em}
  .item-note{font-size:.75rem; color:var(--ink-soft); margin-left:6px}
  .item-desc{margin:5px 0 0; color:var(--ink-soft); font-size:.88rem; max-width:52ch}

  /* Agotado del día: se sigue viendo, apagado y con cartelito. Ocultarlo
     haría que el cliente lo pida igual porque lo vio ayer. */
  .item.agotado{opacity:.48}
  .item.agotado .item-price{text-decoration:line-through}
  .agotado-tag{flex:0 0 auto; font-size:.66rem; text-transform:uppercase; letter-spacing:.08em;
               border:1px solid var(--line); border-radius:999px; padding:2px 9px;
               color:var(--ink-soft); white-space:nowrap}

  /* Sección de destacados: va primera y no tiene foto propia. */
  .estrella{width:15px; height:15px; vertical-align:-2px; margin-right:7px;
            fill:var(--accent); flex:0 0 auto}

  /* ---------- pie ---------- */
  footer{margin-top:56px; padding-top:26px; border-top:1px solid var(--line); text-align:center;
         color:var(--ink-soft); font-size:.84rem; line-height:1.7}
  footer a{color:var(--accent-text); text-decoration:none}

  /* Horarios: no es un enlace, sólo información. Aparece únicamente si está cargado. */
  .horario{display:inline-flex; align-items:flex-start; gap:11px; margin:0 0 10px;
           padding:6px 16px; color:var(--ink); font-size:.9rem;
           white-space:pre-line; text-align:left; line-height:1.55}
  .horario svg{width:19px; height:19px; flex:0 0 auto; margin-top:2px;
               fill:none; stroke:var(--accent-text); stroke-width:1.6;
               stroke-linecap:round; stroke-linejoin:round}

  /* Contacto: cada renglón es un enlace directo, con área de toque cómoda. */
  .contacto{display:flex; flex-direction:column; align-items:center; gap:2px}
  .contacto a{display:inline-flex; align-items:center; gap:11px; min-height:44px;
              padding:10px 16px; border-radius:10px; color:var(--ink); font-size:.9rem;
              transition:background .15s}
  .contacto a:hover{background:var(--line-soft)}
  .contacto img{width:21px; height:21px; flex:0 0 auto; object-fit:contain}

  /* Firma del desarrollador */
  .firma{margin-top:26px; padding-top:18px; border-top:1px solid var(--line-soft);
         font-size:.76rem; color:var(--ink-soft)}
  .firma a{display:inline-flex; align-items:center; gap:7px; min-height:44px;
           padding:8px 14px; border-radius:9px; color:var(--accent-text)}
  .firma a:hover{background:var(--line-soft)}
  .firma img{width:16px; height:16px; object-fit:contain}

  /* ---------- estados ---------- */
  .state{padding:90px 20px; text-align:center; color:var(--ink-soft)}
  .spinner{width:26px; height:26px; margin:0 auto 16px; border:2px solid var(--line);
           border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Vuelta al panel: sólo se muestra si hay sesión de administrador iniciada.
     Un cliente que escanea el QR nunca lo ve. */
  .al-panel{
    position:fixed; right:14px; z-index:10; text-decoration:none;
    bottom:calc(14px + env(safe-area-inset-bottom));
    background:var(--accent); color:var(--accent-ink);
    padding:10px 18px; border-radius:999px;
    font-size:.78rem; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
    box-shadow:0 8px 24px rgba(0,0,0,.28);
  }
  /* Ampliar la foto de un producto al tocarla */
  .lupa{position:fixed; inset:0; z-index:30; display:none; place-items:center;
        background:rgba(12,10,9,.86); padding:22px; cursor:zoom-out}
  .lupa.abierta{display:grid}
  .lupa img{max-width:min(520px, 100%); max-height:78vh; border-radius:14px; object-fit:contain;
            box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .lupa p{margin:16px 0 0; color:#f4efe7; font-size:.95rem; text-align:center; max-width:34ch}
  .offline{position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:9;
           background:var(--aviso); border:1px solid var(--line); color:#f2ede5;
           padding:8px 16px; border-radius:999px; font-size:.76rem; display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important; scroll-behavior:auto !important}}
  html{scroll-behavior:smooth}

  /* ---------- papel ----------
     Para la cocina, el mostrador o para cargar la carta en otro lado.
     Se fuerzan los colores claros: si el mozo tenía el tema oscuro
     puesto, igual sale una hoja blanca y no un rectángulo negro. */
  @media print{
    :root, :root[data-theme="oscuro"], :root[data-theme="claro"]{
      --bg:#fff; --ink:#111; --ink-soft:#555;
      --line:#c9c9c9; --line-soft:#e0e0e0; --dots:#bbb;
      --accent:#1f5c4d; --accent-text:#1f5c4d; --accent-ink:#fff;
    }
    @page{margin:14mm 12mm}
    #bg, nav, footer, .al-panel, .offline, .sec-foto, .rule, #tagline{display:none !important}
    html, body{background:#fff !important}
    .wrap{max-width:none; padding:0}
    header{padding:0 0 6mm; text-align:left; display:flex; align-items:center; gap:10px}
    #logo{width:52px; height:52px; margin:0}
    h1{font-size:19pt}
    main{columns:2; column-gap:9mm}
    section{padding-top:0; margin:0 0 5mm; break-inside:auto}
    section.con-foto{padding-top:0}
    .sec-head{break-after:avoid; padding-bottom:6px; margin-bottom:2px}
    h2{font-size:11.5pt}
    h2::after{margin-top:5px}
    .item{break-inside:avoid; padding:5px 0; font-size:9.5pt}
    .item-name{font-size:9.5pt}
    .item-price{font-size:9.5pt}
    .item-desc{font-size:8pt; margin-top:2px}
    .item.agotado{opacity:1}
    .item.agotado .item-name::after{content:" (hoy no hay)"; font-size:8pt; color:#555}
    .agotado-tag, .lupa{display:none}
    /* En papel las fotos de producto no van: gastan tinta y la hoja es
       para la cocina o el mostrador, no para vender. */
    .item-foto{display:none}
    .item.con-foto{display:block}
  }
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap">
  <header>
    <img id="logo" alt="">
    <h1 id="barName">&nbsp;</h1>

  </header>
  <nav id="nav" hidden>
    <div class="buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4-4"/></svg>

      <button id="qClear" type="button" aria-label="Borrar la búsqueda" hidden>&times;</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  const CACHE_KEY = "carta_cache_v1";
  const FONTS = {
    serif: "'Playfair Display', Georgia, serif",
    sans: "'Inter', system-ui, sans-serif",
    condensed: "'Oswald', system-ui, sans-serif"
  };

  /* ---------- carta de ejemplo (modo demo) ---------- */
  const DEMO = {
    settings: {
      bar_name: "Bar Ejemplo", tagline: "Cocina de barra · Coctelería",
      logo_url: null, bg_url: null, bg_dim: 0.6, accent: "#e2b263", font: "serif",
      currency_symbol: "$",
      footer_text: "Av. Siempreviva 742 · Mar-Dom 19 a 02 h\n@barejemplo"
    },
    categories: [
      { id: "c1", name: "Para empezar", description: "", sort_order: 1, visible: true },
      { id: "c2", name: "Tragos de autor", description: "Preparados al momento", sort_order: 2, visible: true },
      { id: "c3", name: "Cervezas", description: "", sort_order: 3, visible: true }
    ],
    products: [
      { id: "p1", category_id: "c1", name: "Papas bravas", description: "Con alioli de ajo asado y pimentón ahumado", price: 6500, price_note: "", sort_order: 1, visible: true },
      { id: "p2", category_id: "c1", name: "Tabla de fiambres", description: "Selección de tres quesos, jamón crudo y encurtidos", price: 12800, price_note: "para 2", sort_order: 2, visible: true },
      { id: "p3", category_id: "c2", name: "Negroni de la casa", description: "Gin infusionado en pomelo, vermut rosso, campari", price: 8200, price_note: "", sort_order: 1, visible: true },
      { id: "p4", category_id: "c2", name: "Gin tonic botánico", description: "Gin nacional, tónica, romero y enebro", price: 7600, price_note: "", sort_order: 2, visible: true },
      { id: "p5", category_id: "c3", name: "Pinta rubia tirada", description: "", price: 4500, price_note: "473 ml", sort_order: 1, visible: true },
      { id: "p6", category_id: "c3", name: "IPA rotativa", description: "Preguntá cuál está de turno", price: 5200, price_note: "473 ml", sort_order: 2, visible: true }
    ]
  };

  /* ---------- utilidades ---------- */
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function money(value, symbol) {
    if (value == null || value === "") return "";
    const n = Number(value);
    if (!isFinite(n)) return "";
    const dec = n % 1 === 0 ? 0 : 2;
    return (symbol || "$") + " " + n.toLocaleString("es-AR", {
      minimumFractionDigits: dec, maximumFractionDigits: dec
    });
  }

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) { return null; }
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) { /* modo privado */ }
  }

  /* ---------- pintar ---------- */
  function applyTheme(s) {
    // Tema claro u oscuro. Claro es el estado sin atributo, que es el que ya
    // está pintado, así que sólo marcamos el documento cuando toca oscuro.
    const tema = s.theme === "claro" ? "claro" : "oscuro";
    if (tema === "oscuro") document.documentElement.dataset.theme = "oscuro";
    else delete document.documentElement.dataset.theme;
    try { localStorage.setItem("carta_tema", tema); } catch (e) {}
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = tema === "claro" ? "#f7f2ea" : "#0d0b0a";

    const root = document.documentElement.style;
    root.setProperty("--accent", s.accent || "#e2b263");
    root.setProperty("--dim", s.bg_dim == null ? 0.6 : s.bg_dim);
    root.setProperty("--font", FONTS[s.font] || FONTS.serif);
    if (s.bg_url) $("#bg").style.backgroundImage = "url('" + s.bg_url.replace(/'/g, "%27") + "')";
    const logo = $("#logo");
    if (s.logo_url) { logo.src = s.logo_url; logo.alt = s.bar_name || ""; logo.style.display = "block"; }
    $("#barName").textContent = s.bar_name || "Carta";
    $("#tagline").textContent = s.tagline || "";
    document.title = s.bar_name ? s.bar_name + " · Carta" : "Carta";
  }

  /* ---------- contacto del pie ---------- */
  // Logos oficiales de cada servicio, en la carpeta icons/.
  const icono = (archivo) =>
    '<img src="icons/contacto-' + archivo + '.png" alt="" width="21" height="21" loading="lazy">';
  const ICONO = {
    chat: icono("whatsapp"),
    camara: icono("instagram"),
    perfil: icono("facebook"),
    pin: icono("mapa")
  };

  // WhatsApp necesita el número sin símbolos. En Argentina, además, el 9 después
  // del 54: si el número no lo trae, se lo agregamos.
  function waLink(numero) {
    let d = String(numero || "").replace(/\D/g, "");
    if (d.length < 8) return null;
    if (d.slice(0, 2) === "54" && d[2] !== "9") d = "549" + d.slice(2);
    return "https://wa.me/" + d;
  }

  const usuario = (v) => String(v || "").trim().replace(/^@/, "").replace(/^.*\/([^/?#]+)\/?$/, "$1");
  const seguro = (u) => (/^https?:\/\//i.test(String(u || "")) ? u : null);

  function fila(href, icono, texto) {
    if (!href) return "";
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' +
           icono + "<span>" + esc(texto) + "</span></a>";
  }

  // Reloj de trazo propio: no representa ninguna marca.
  const RELOJ = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.4 2"/></svg>';

  // Los horarios viven en la columna que antes usaba el pie de página libre.
  function horarios(s) {
    const txt = String(s.footer_text || "").trim();
    if (!txt) return "";
    return '<div class="horario">' + RELOJ + "<span>" + esc(txt) + "</span></div>";
  }

  function contacto(s) {
    const filas = [];
    if (s.whatsapp) filas.push(fila(waLink(s.whatsapp), ICONO.chat, "WhatsApp " + s.whatsapp));
    const ig = usuario(s.instagram);
    if (ig) filas.push(fila("https://www.instagram.com/" + encodeURIComponent(ig) + "/", ICONO.camara, "Instagram @" + ig));
    const fb = usuario(s.facebook);
    if (fb) filas.push(fila("https://www.facebook.com/" + encodeURIComponent(fb) + "/", ICONO.perfil, "Facebook " + fb));
    if (s.direccion) {
      const mapa = seguro(s.mapa_url) ||
        "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.direccion);
      filas.push(fila(mapa, ICONO.pin, s.direccion));
    }
    return filas.length ? '<div class="contacto">' + filas.join("") + "</div>" : "";
  }

  // Firma del desarrollador. Se muestra siempre, al pie de todo.
  const AUTOR = { nombre: "Joaquín Pedemonte", whatsapp: "+54 9 3436 61-5390" };

  function firma() {
    return '<div class="firma">Desarrollado por ' + esc(AUTOR.nombre) + "<br>" +
      fila(waLink(AUTOR.whatsapp), ICONO.chat, AUTOR.whatsapp) + "</div>";
  }

  function render(data) {
    applyTheme(data.settings || {});
    const symbol = (data.settings && data.settings.currency_symbol) || "$";
    const cats = (data.categories || []).filter((c) => c.visible !== false)
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    const prods = (data.products || []).filter((p) => p.visible !== false)
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

    const menu = $("#menu");
    const withItems = cats.filter((c) => prods.some((p) => p.category_id === c.id));

    // Los destacados arman una sección propia arriba de todo. Siguen
    // apareciendo también en su sección de siempre. Los agotados del día
    // no entran acá: no tiene sentido empujar algo que hoy no hay.
    const grupos = withItems.map((c) => ({
      id: "sec-" + c.id, name: c.name, description: c.description,
      image_url: c.image_url, items: prods.filter((p) => p.category_id === c.id)
    }));
    const destacados = prods.filter((p) => p.featured && !p.sold_out);
    if (destacados.length) {
      grupos.unshift({
        id: "sec-destacados", name: "Los más pedidos", description: "",
        image_url: null, items: destacados, estrella: true
      });
    }

    if (!withItems.length) {
      menu.innerHTML = '<div class="state">La carta se está actualizando.<br>Volvé a intentar en un rato.</div>';
      $("#nav").hidden = true;
      return;
    }

    menu.innerHTML = grupos.map((c) => {
      const items = c.items.map((p) => {
        const precio = money(p.price, symbol);
        const nota = p.price_note ? '<span class="item-note">' + esc(p.price_note) + "</span>" : "";
        // Sin precio cargado decimos "Consultar": el hueco vacío se leía como un error.
        const derecha = '<span class="dots"></span>' + (precio
          ? '<span class="item-price">' + esc(precio) + nota + "</span>"
          : '<span class="item-price consultar">Consultar' + nota + "</span>");
        const busca = normalizar([p.name, p.description, p.price_note].join(" "));
        const cuerpo = `
          <div class="item-head">
            <span class="item-name">${esc(p.name)}</span>
            ${p.sold_out ? '<span class="agotado-tag">Hoy no hay</span>' : ""}
            ${derecha}
          </div>
          ${p.description ? '<p class="item-desc">' + esc(p.description) + "</p>" : ""}`;
        if (!p.image_url) {
          return `<article class="item${p.sold_out ? " agotado" : ""}" data-busca="${esc(busca)}">${cuerpo}</article>`;
        }
        return `
        <article class="item con-foto${p.sold_out ? " agotado" : ""}" data-busca="${esc(busca)}">
          <img class="item-foto" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" decoding="async">
          <div class="item-cuerpo">${cuerpo}</div>
        </article>`;
      }).join("");
      const foto = c.image_url
        ? '<img class="sec-foto" src="' + esc(c.image_url) + '" alt="" loading="lazy" decoding="async">'
        : "";
      const estrella = c.estrella
        ? '<svg class="estrella" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4-5.8-3-5.8 3 1.1-6.4L2.6 9.4l6.5-.9z"/></svg>'
        : "";
      return `<section id="${esc(c.id)}" data-busca="${esc(normalizar(c.name + " " + (c.description || "")))}"${c.image_url ? ' class="con-foto"' : ""}>
          ${foto}
          <div class="sec-head">
            <h2>${estrella}${esc(c.name)}</h2>
            ${c.description ? '<p class="sec-desc">' + esc(c.description) + "</p>" : ""}
          </div>${items}
        </section>`;
    }).join("");

    const chips = $("#chips");
    chips.innerHTML = grupos.map((c, i) =>
      `<button class="chip" data-target="${esc(c.id)}" aria-current="${i === 0}">${esc(c.name)}</button>`).join("");
    $("#nav").hidden = grupos.length < 2;

    chips.addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      const el = document.getElementById(b.dataset.target);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    const foot = $("#footer");
    const s = data.settings || {};
    foot.innerHTML = horarios(s) + contacto(s) + firma();
    foot.hidden = false;

    filtrar($("#q").value);
    setupScrollSpy();

    // Entrando con ?imprimir, la carta se abre directo en el diálogo de
    // impresión. Es lo que usa el botón del panel.
    if (/[?&]imprimir\b/.test(location.search) && !render._imprimio) {
      render._imprimio = true;
      setTimeout(() => window.print(), 600);
    }
  }

  /* ---------- conteo ----------
     Sólo contadores: cuántas veces se abrió la carta, qué secciones se
     miraron, qué se buscó sin encontrar nada y si entraron por el QR o
     por un enlace. No se guarda nada de quién mira: ni quién, ni dónde,
     ni con qué aparato. La base sólo recibe "sumale uno a esto". */
  const conteo = {
    db: null,
    apagado: false,
    vistas: {},          // una sección se cuenta una sola vez por visita

    marca(clave) {
      try {
        const k = "carta_ct_" + clave;
        if (sessionStorage.getItem(k)) return false;
        sessionStorage.setItem(k, "1");
        return true;
      } catch (e) {
        if (this.vistas[clave]) return false;
        this.vistas[clave] = true;
        return true;
      }
    },

    sumar(tipo, clave) {
      if (this.apagado || !this.db) return;
      try {
        this.db.rpc("contar", { p_tipo: tipo, p_clave: String(clave || "-") })
          .then(() => {}, () => {});        // si falla, la carta sigue igual
      } catch (e) { /* nunca frena nada */ }
    },

    arrancar() {
      if (this.apagado) return;
      // Con ?imprimir no contamos: es el dueño sacando la hoja para la cocina.
      if (/[?&]imprimir\b/.test(location.search)) { this.apagado = true; return; }
      if (!this.marca("apertura")) return;
      this.sumar("apertura", "-");
      this.sumar("origen", /[?&]m=qr\b/.test(location.search) ? "qr" : "enlace");
    },

    seccion(nombre) {
      if (!nombre || !this.marca("sec:" + nombre)) return;
      this.sumar("seccion", nombre);
    },

    // Se espera a que deje de escribir: si no, "s", "su", "sus", "sush"
    // se guardarían como cuatro búsquedas fallidas distintas.
    busqueda(texto, hubo) {
      clearTimeout(this._t);
      const q = String(texto || "").trim();
      if (hubo || q.length < 3) return;
      this._t = setTimeout(() => this.sumar("busca_sin", q.toLowerCase()), 1400);
    }
  };

  /* ---------- buscador ---------- */
  // Sin acentos y en minúscula: así "cafe" encuentra "Cafetería" y
  // "tiramisu" encuentra "Tiramisú".
  function normalizar(s) {
    return String(s == null ? "" : s)
      .normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }

  // El alto real de la barra pegajosa, para que el salto a una sección
  // no quede tapado por ella.
  function medirNav() {
    const nav = $("#nav");
    const alto = nav.hidden ? 0 : Math.round(nav.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--nav-h", alto + "px");
    return alto;
  }

  function filtrar(texto) {
    const palabras = normalizar(texto).split(/\s+/).filter(Boolean);
    const buscando = palabras.length > 0;
    const coincide = (heno) => palabras.every((w) => heno.indexOf(w) !== -1);
    let encontrados = 0;

    [].slice.call(document.querySelectorAll("main section")).forEach((sec) => {
      // Si el nombre de la sección coincide, mostramos la sección entera.
      const secCoincide = buscando && coincide(sec.dataset.busca || "");
      let ultimo = null;
      [].slice.call(sec.querySelectorAll(".item")).forEach((it) => {
        const ok = !buscando || secCoincide || coincide(it.dataset.busca || "");
        it.hidden = !ok;
        it.classList.remove("ultimo");
        if (ok) { ultimo = it; encontrados++; }
      });
      if (ultimo) ultimo.classList.add("ultimo");   // sin rayita colgando al final
      sec.hidden = buscando && !ultimo;
    });

    $("#chips").hidden = buscando;     // filtrando, saltar de sección no tiene sentido
    $("#qClear").hidden = !buscando;

    const info = $("#qInfo");
    if (buscando) {
      info.textContent = encontrados === 0
        ? "Nada con “" + texto.trim() + "”"
        : encontrados + (encontrados === 1 ? " resultado" : " resultados");
      info.hidden = false;
    } else {
      info.hidden = true;
    }
    medirNav();
    if (buscando) conteo.busqueda(texto, encontrados > 0);
  }

  /* ---------- ampliar una foto ---------- */
  const lupa = $("#lupa");
  function cerrarLupa() {
    lupa.classList.remove("abierta");
    lupa.hidden = true;
    $("#lupaImg").removeAttribute("src");
  }
  $("#menu").addEventListener("click", (e) => {
    const foto = e.target.closest(".item-foto");
    if (!foto) return;
    $("#lupaImg").src = foto.src;
    $("#lupaImg").alt = foto.alt || "";
    $("#lupaPie").textContent = foto.alt || "";
    lupa.hidden = false;
    lupa.classList.add("abierta");
  });
  lupa.addEventListener("click", cerrarLupa);
  addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarLupa(); });

  $("#q").addEventListener("input", (e) => filtrar(e.target.value));
  $("#qClear").addEventListener("click", () => {
    const campo = $("#q");
    campo.value = "";
    filtrar("");
    campo.focus();
  });
  addEventListener("resize", medirNav);

  function setupScrollSpy() {
    const nav = $("#nav");
    const sections = [].slice.call(document.querySelectorAll("main section"));
    const chips = [].slice.call(document.querySelectorAll(".chip"));
    if (!sections.length || !("IntersectionObserver" in window)) return;

    const alto = medirNav();
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        chips.forEach((ch) => ch.setAttribute("aria-current", ch.dataset.target === en.target.id));
        const active = chips.find((ch) => ch.dataset.target === en.target.id);
        if (active) conteo.seccion(active.textContent.trim());
        if (active && active.scrollIntoView) {
          active.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        }
      });
    }, { rootMargin: "-" + (alto + 6) + "px 0px -70% 0px", threshold: 0 });
    sections.forEach((s) => io.observe(s));

    addEventListener("scroll", () => {
      nav.classList.toggle("stuck", nav.getBoundingClientRect().top <= 1);
    }, { passive: true });
  }

  /* ---------- carga ---------- */
  // Tolera que la URL venga con barra final o con /rest/v1 pegado al final.
  function baseUrl(u) {
    return String(u || "").trim()
      .replace(/\/+$/, "")
      .replace(/\/rest\/v\d+$/, "")
      .replace(/\/+$/, "");
  }

  async function load() {
    // Sin configurar: mostramos la carta de ejemplo, pero avisando que lo es.
    if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
      render(DEMO);
      const aviso = $("#offline");
      aviso.textContent = "Carta de ejemplo — falta conectar la base de datos";
      aviso.style.display = "block";
      return;
    }

    const cached = readCache();

    const sinRed = (msg) => {
      console.error("[carta] " + msg);
      if (cached) { render(cached); $("#offline").style.display = "block"; }
      else $("#menu").innerHTML = '<div class="state">No pudimos cargar la carta.<br>Revisá tu conexión y volvé a intentar.</div>';
    };

    // Si el CDN no cargó (wifi caído, bloqueador), mostramos la última carta guardada.
    if (!window.supabase || !window.supabase.createClient) return sinRed("no cargó la librería de Supabase");

    const db = window.supabase.createClient(baseUrl(CONFIG.SUPABASE_URL), CONFIG.SUPABASE_ANON_KEY);
    conteo.db = db;

    // Si el navegador tiene sesión de administrador, ofrecemos la vuelta al panel
    // y NO contamos la visita: el dueño recargando veinte veces no es un cliente.
    db.auth.getSession()
      .then(({ data }) => {
        if (data && data.session) { $("#alPanel").hidden = false; conteo.apagado = true; }
        else conteo.arrancar();
      })
      .catch(() => conteo.arrancar());

    try {
      const [s, c, p] = await Promise.all([
        db.from("settings").select("*").eq("id", 1).maybeSingle(),
        db.from("categories").select("*").order("sort_order"),
        db.from("products").select("*").order("sort_order")
      ]);
      if (s.error || c.error || p.error) throw (s.error || c.error || p.error);

      const data = { settings: s.data || DEMO.settings, categories: c.data || [], products: p.data || [] };
      writeCache(data);
      render(data);
    } catch (err) {
      console.error("[carta] no se pudo cargar:", err);
      sinRed("error al consultar la base");
    }
  }

  load();

  // App instalable: registra el service worker (si el navegador no lo soporta, no pasa nada).
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
